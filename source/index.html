<!--
  Tells — legal index (OPTIONAL)

  This exists so the folder URL itself doesn't 404. It is not referenced by the
  app and nothing links to it; the app opens the two documents directly.

  IMPORTANT: this file belongs in the SAME subfolder as the two documents, e.g.
  /vibecheck/index.html. Do not drop it at the root of a Pages repo that already
  has a homepage — it would replace it.

  Same palette and type as the two documents, deliberately smaller: this is a
  signpost, not a page anyone should have to read.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tells — Legal</title>

<style>
:root{
  --ground:#FFF6EF;
  --raised:#FBE9E0;
  --ink:#2E0413;
  --ink-soft:#6F5560;
  --rule:rgba(46,4,19,.13);
  --accent:#D6004E;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#1A0710;
    --raised:#26101A;
    --ink:#FDEFF4;
    --ink-soft:#C4A0AE;
    --rule:rgba(255,255,255,.14);
    --accent:#FF6198;
  }
}
:root[data-theme="dark"]{
  --ground:#1A0710;
  --raised:#26101A;
  --ink:#FDEFF4;
  --ink-soft:#C4A0AE;
  --rule:rgba(255,255,255,.14);
  --accent:#FF6198;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:var(--ground);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
  font-size:16.5px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  display:flex;
  align-items:center;
}

.page{max-width:34rem;margin:0 auto;padding:3rem 1.5rem}

h1{
  font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  font-weight:800;letter-spacing:-.035em;line-height:1.05;
  font-size:clamp(2.1rem,6vw,2.9rem);
  margin:0 0 .6rem;text-wrap:balance;
}

.meta{
  font-family:ui-monospace,"SF Mono",Menlo,monospace;
  font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);
  margin:0 0 2.4rem;
}

.docs{
  display:flex;
  flex-direction:column;
  gap:.75rem;
  margin:0 0 2.4rem;
  padding:0;
  list-style:none;
}

.docs a{
  display:block;
  background:var(--raised);
  border:1px solid var(--rule);
  border-radius:14px;
  padding:1.15rem 1.35rem;
  text-decoration:none;
  color:var(--ink);
  transition:border-color .15s ease, transform .15s ease;
}
.docs a:hover,
.docs a:focus-visible{
  border-color:var(--accent);
  transform:translateY(-1px);
}
.docs a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

.docs strong{
  display:block;
  font-family:ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  font-weight:800;letter-spacing:-.02em;
  font-size:1.12rem;
}
.docs span{
  display:block;
  color:var(--ink-soft);
  font-size:.94rem;
  margin-top:.15rem;
}

footer{
  border-top:1px solid var(--rule);
  padding-top:1.4rem;
  color:var(--ink-soft);
  font-size:.9rem;
}
footer a{color:var(--accent)}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
}

@media print{
  body{background:#fff;color:#000}
}
</style>
</head>

<body>
<div class="page">

  <h1>Tells</h1>
  <p class="meta">Legal · Last updated [DATE]</p>

  <ul class="docs">
    <li>
      <a href="privacy-policy.html">
        <strong>Privacy Policy</strong>
        <span>What the app collects, which is nothing.</span>
      </a>
    </li>
    <li>
      <a href="terms-of-use.html">
        <strong>Terms of Use</strong>
        <span>The agreement, and what the score is and isn't.</span>
      </a>
    </li>
    <li>
      <a href="support.html">
        <strong>Support</strong>
        <span>Common questions, and how to reach a person.</span>
      </a>
    </li>
  </ul>

  <footer>
    <p>[COMPANY] · <a href="mailto:[EMAIL]">[EMAIL]</a></p>
  </footer>

</div>
</body>
</html>
